<!DOCTYPE html>

     crossorigin="anonymous"></script>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3d2314">
  <meta name="description" content="Elmira Bakes — Tatlı lezzetler, sosyal medyada bizi takip edin.">
  <title>Elmira Bakes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf6f0;
      --warm-white: #fff9f2;
      --cocoa: #3d2314;
      --caramel: #c47a3a;
      --honey: #e8a84c;
      --rose: #d4847a;
      --shadow: rgba(61, 35, 20, 0.12);
      --shadow-deep: rgba(61, 35, 20, 0.22);
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      color: var(--cocoa);
      display: flex;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px calc(32px + var(--safe-bottom));
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Arka plan deseni — harici görsel yok */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232, 168, 76, 0.35), transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 80%, rgba(212, 132, 122, 0.2), transparent 55%),
        radial-gradient(ellipse 50% 35% at 0% 60%, rgba(196, 122, 58, 0.15), transparent 50%),
        var(--cream);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 8c-2 0-4 1.5-4 4v2h8v-2c0-2.5-2-4-4-4zm-8 8c-1.5 0-3 1-3 3v18c0 4 3 7 7 7h8c4 0 7-3 7-7V19c0-2-1.5-3-3-3H22z' fill='%233d2314'/%3E%3C/svg%3E");
      background-size: 48px 48px;
      pointer-events: none;
    }

    .page {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeUp 0.7s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Profil alanı */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      width: 100%;
    }

    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--honey) 0%, var(--caramel) 55%, #a85f2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 32px var(--shadow-deep),
        0 0 0 4px var(--warm-white),
        0 0 0 6px rgba(196, 122, 58, 0.25);
      position: relative;
      flex-shrink: 0;
    }

    .avatar::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 249, 242, 0.4);
      animation: spin 24s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar svg {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    .brand {
      font-size: clamp(1.75rem, 6vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--cocoa) 30%, var(--caramel) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 0.95rem;
      color: rgba(61, 35, 20, 0.72);
      max-width: 280px;
      font-weight: 400;
    }

    .divider {
      width: 48px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--caramel), transparent);
      opacity: 0.6;
    }

    /* Link listesi */
    .links {
      list-style: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .links li {
      animation: fadeUp 0.6s ease-out both;
    }

    .links li:nth-child(1) { animation-delay: 0.1s; }
    .links li:nth-child(2) { animation-delay: 0.18s; }
    .links li:nth-child(3) { animation-delay: 0.26s; }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--cocoa);
      background: var(--warm-white);
      border: 1.5px solid rgba(196, 122, 58, 0.18);
      box-shadow: 0 4px 16px var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .link-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px var(--shadow-deep);
        border-color: rgba(196, 122, 58, 0.35);
      }
      .link-btn:hover::before {
        transform: translateX(100%);
      }
    }

    .link-btn:focus-visible {
      outline: 3px solid var(--caramel);
      outline-offset: 2px;
    }

    .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-wrap svg {
      width: 24px;
      height: 24px;
    }

    /* Platform renkleri */
    .link-btn--instagram .icon-wrap {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .link-btn--instagram .icon-wrap svg { fill: #fff; }

    .link-btn--youtube .icon-wrap {
      background: #ff0000;
    }
    .link-btn--youtube .icon-wrap svg { fill: #fff; }

    .link-btn--facebook .icon-wrap {
      background: #1877f2;
    }
    .link-btn--facebook .icon-wrap svg { fill: #fff; }

    .link-text {
      flex: 1;
      min-width: 0;
    }

    .link-label {
      display: block;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .link-handle {
      display: block;
      font-size: 0.8rem;
      color: rgba(61, 35, 20, 0.55);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      width: 20px;
      height: 20px;
      opacity: 0.35;
      flex-shrink: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    @media (hover: hover) {
      .link-btn:hover .arrow {
        transform: translateX(3px);
        opacity: 0.6;
      }
    }

    .footer {
      margin-top: 8px;
      font-size: 0.75rem;
      color: rgba(61, 35, 20, 0.4);
      text-align: center;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .avatar::after { animation: none; }
    }
  </style>
</head>
